name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Build release files
        run: |
          mkdir dist
          cp greenmind.json package.json package-lock.json installer/settings.js dist/
          # the released installer downloads the files of this release
          sed "s/^GM_REF=\"\${GM_REF:-[^}]*}\"/GM_REF=\"\${GM_REF:-${GITHUB_REF_NAME}}\"/" installer/greenmind_installer > dist/greenmind_installer
          grep -q "GM_REF:-${GITHUB_REF_NAME}}" dist/greenmind_installer
          chmod +x dist/greenmind_installer
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "GreenMind ${GITHUB_REF_NAME}" --generate-notes ${prerelease}
